<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF5A36">
<link rel="manifest" href="manifest.json">
<script src="data/i18n.js"></script>
<title>Recursos de apps de idiomas | HWLLY | ENGLISH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EC;--surface:#FFFFFF;--ink:#14213D;--muted:#5B6478;--line:#E2DCCF;--teal:#FF5A36;--teal-soft:#FFE3DA;--amber:#6C4DFF;--amber-soft:#E7E1FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1424;--surface:#161E33;--ink:#F4F1EA;--muted:#9AA3B8;--line:#26304A;--teal:#FF7A5C;--teal-soft:#3A2620;--amber:#A897FF;--amber-soft:#262245}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0}
a{color:var(--teal)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:60rem;margin:0 auto;padding:1rem .9rem 3rem}
nav a{text-decoration:none;font-weight:700}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.toprow .back{margin-bottom:0}
h1{font-size:clamp(1.8rem,6vw,2.6rem);margin:.6rem 0 .3rem}
.lead{color:var(--muted);margin:0 0 1rem}
.aviso{font-size:.9rem;color:var(--muted);border-left:3px solid var(--teal);padding:.4rem .8rem;margin:0 0 1.2rem;border-radius:0 8px 8px 0;background:var(--surface)}
.filtros{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.filtros button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.45rem .9rem;min-height:44px;font-size:.95rem}
.filtros button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr));gap:.8rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1rem 1.05rem;display:flex;flex-direction:column;gap:.45rem}
.card h2{font-size:1.08rem}
.card p{margin:0;font-size:.95rem}
.tag{align-self:flex-start;font-size:.78rem;font-weight:700;padding:.1rem .55rem;border-radius:999px;background:var(--amber-soft);color:var(--amber)}
.tag.ok{background:var(--teal-soft);color:var(--teal)}
.apps{font-size:.85rem;color:var(--muted)}
.ideia{font-size:.9rem;border-top:1px solid var(--line);padding-top:.5rem;color:var(--ink)}
.vazio{color:var(--muted)}
@media (max-width:640px){.wrap{padding:.8rem .8rem 3rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="toprow"><nav><a href="index.html">← Voltar ao plano</a></nav><div data-langsw></div></div>
  <h1>Recursos de apps de idiomas</h1>
  <p class="lead">Funções de Duolingo, Babbel, Busuu, Memrise, Speak, Pimsleur, Lingoda e Anki, comparadas com o que já existe no HWLLY.</p>
  <p class="aviso" id="aviso">Carregando o banco de recursos…</p>

  <div class="filtros" id="filtros" role="group" aria-label="Filtrar por categoria"></div>
  <div class="filtros" id="status" role="group" aria-label="Filtrar por situação"></div>

  <div class="grid" id="lista" aria-live="polite"></div>
</div>
<script>
const ESTADO={cat:"todas", sit:"todos", dados:null};
const $=id=>document.getElementById(id);
const el=(tag,cls,txt)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e;};

function botao(label,ativo,onclick){
  const b=el("button",null,label); b.setAttribute("aria-pressed",ativo); b.onclick=onclick; return b;
}

function desenhaFiltros(){
  const cats=ESTADO.dados.categorias;
  const f=$("filtros"); f.innerHTML="";
  f.append(botao("Todas",ESTADO.cat==="todas",()=>{ESTADO.cat="todas"; desenha();}));
  Object.entries(cats).forEach(([k,v])=>f.append(botao(v,ESTADO.cat===k,()=>{ESTADO.cat=k; desenha();})));
  const s=$("status"); s.innerHTML="";
  [["todos","Todos"],["temos","Já temos"],["falta","Ainda não temos"]].forEach(([k,l])=>s.append(botao(l,ESTADO.sit===k,()=>{ESTADO.sit=k; desenha();})));
}

function desenha(){
  desenhaFiltros();
  const dados=ESTADO.dados;
  const appsNome=Object.fromEntries(dados.apps.map(a=>[a.id,a.nome]));
  const lista=$("lista"); lista.innerHTML="";
  const itens=dados.recursos.filter(r=>(ESTADO.cat==="todas"||r.categoria===ESTADO.cat)&&(ESTADO.sit==="todos"||(ESTADO.sit==="temos")===r.ja_temos));
  if(!itens.length){lista.append(el("p","vazio","Nenhum recurso com esse filtro.")); return;}
  itens.forEach(r=>{
    const c=el("article","card");
    c.append(el("span",r.ja_temos?"tag ok":"tag", r.ja_temos?"Já temos":"Ainda não temos"));
    c.append(el("h2",null,r.nome), el("p",null,r.descricao));
    c.append(el("p","apps","Em: "+r.apps.map(id=>appsNome[id]||id).join(", ")));
    c.append(el("p","ideia","Para o HWLLY: "+r.ideia_para_o_site));
    lista.append(c);
  });
}

(async()=>{
  try{
    const r=await fetch("data/features.json",{cache:"no-cache"});
    if(!r.ok) throw new Error(r.status);
    ESTADO.dados=await r.json();
    $("aviso").textContent=ESTADO.dados.aviso+" Atualizado em "+ESTADO.dados.atualizado_em+".";
    desenha();
  }catch(e){
    $("aviso").textContent="Não foi possível carregar o banco de recursos. Verifique a conexão e recarregue a página.";
  }
})();
</script>
</body>
</html>
