<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF5A36">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HWLLY">
<title>HWLLY | ENGLISH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EC; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6478; --line:#E2DCCF;
  --teal:#FF5A36; --teal-soft:#FFE3DA; --amber:#6C4DFF; --amber-soft:#E7E1FF; --danger:#C2321A;
  --bar-empty:#E4DDD0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --surface:#161E33; --ink:#F4F1EA; --muted:#9AA3B8; --line:#26304A;
    --teal:#FF7A5C; --teal-soft:#3A2620; --amber:#A897FF; --amber-soft:#262245; --danger:#FF8A75;
    --bar-empty:#27314D;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#161E33; --ink:#F4F1EA; --muted:#9AA3B8; --line:#26304A;
  --teal:#FF7A5C; --teal-soft:#3A2620; --amber:#A897FF; --amber-soft:#262245; --danger:#FF8A75;
  --bar-empty:#27314D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;
  background-image:radial-gradient(60rem 30rem at 100% -10%,color-mix(in srgb,var(--teal) 18%,transparent),transparent 60%),radial-gradient(40rem 25rem at -10% 10%,color-mix(in srgb,var(--amber) 14%,transparent),transparent 60%);background-attachment:fixed}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:52rem;margin:0 auto;padding:1.5rem 1rem 4rem}

header{padding:1.5rem 0 1rem}
h1{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:800;letter-spacing:.01em}
.brand{display:flex;align-items:center;gap:.8rem}
.logo{width:clamp(3rem,10vw,4rem);height:auto;flex:none;filter:drop-shadow(0 4px 10px color-mix(in srgb,var(--teal) 35%,transparent))}
h1 .bar{color:var(--teal);font-weight:500;margin:0 .15em}
.kicker{margin:.3rem 0 0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.2rem;color:var(--teal)}
.sub{color:var(--muted);margin:.4rem 0 0}
.wave{display:flex;align-items:flex-end;gap:3px;height:84px;margin:1.6rem 0 .5rem;overflow-x:auto}
.wave button{flex:1 0 12px;min-width:12px;border:0;padding:0;background:none;height:100%;display:flex;align-items:flex-end}
.wave span{display:block;width:100%;border-radius:3px 3px 1px 1px;background:var(--bar-empty);transition:height .35s ease,background .2s}
.wave .full span{background:var(--teal)}
.wave .part span{background:color-mix(in srgb,var(--teal) 55%,var(--bar-empty))}
.wave .rev.full span{background:var(--amber)}
.wave .today span{box-shadow:0 0 0 2px var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;color:var(--muted);font-size:.95rem}
.stats strong{color:var(--ink)}
#sync{font-size:.85rem}
.opt{display:inline-flex;align-items:center;gap:.4rem;margin:0;font-weight:400;font-size:.9rem;cursor:pointer}
.opt input{width:1.1rem;height:1.1rem;accent-color:var(--teal)}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:.4rem;overflow-x:auto;padding:.75rem 0;margin-bottom:.5rem;border-bottom:1px solid var(--line)}
nav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.4rem .95rem;white-space:nowrap;font-size:.95rem}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.weekhead{margin:1.5rem 0 1rem}
.weekhead h2{font-size:1.6rem;font-weight:700}
.weekhead p{margin:.3rem 0 0;color:var(--muted)}

.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.9rem}
.day.isToday{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;margin-bottom:.5rem}
.dayhead h3{font-size:1.15rem;font-weight:700}
.tag{font-size:.8rem;padding:.1rem .55rem;border-radius:999px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
.tag.rev{background:var(--amber-soft);color:var(--amber)}
.task{display:grid;grid-template-columns:auto 1fr;gap:.75rem;padding:.6rem 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.check{width:2rem;height:2rem;border-radius:8px;border:2px solid var(--teal);background:var(--surface);display:grid;place-items:center;margin-top:.15rem;padding:0}
.check svg{width:1.2rem;height:1.2rem;opacity:0}
.task{cursor:pointer}
.task:hover .check{background:var(--teal-soft)}
.task.done:hover .check{background:var(--teal)}
.task.done .check{background:var(--teal);border-color:var(--teal)}
.task.done .check svg{opacity:1}
.task.done .ttext{color:var(--muted)}
.ttext b{color:var(--ink)}
.note{margin-top:.45rem;background:var(--bg);border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:.45rem .7rem;font-size:.95rem;white-space:pre-wrap;word-break:break-word}
.note .w{display:block;color:var(--muted);font-size:.88rem;margin-top:.2rem}
.linkbtn{background:none;border:0;padding:0;color:var(--teal);font-size:.9rem;text-decoration:underline;text-underline-offset:3px;margin-top:.3rem}

.report{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:1.1rem 1.2rem;margin:1.5rem 0}
.report h3{font-size:1.25rem;margin-bottom:.3rem}
.report p.hint{color:var(--muted);margin:.2rem 0 .8rem;font-size:.95rem}
.primary{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:.65rem 1.1rem;font-weight:700}
.primary:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:.6rem 1rem}
[hidden]{display:none!important}
#tabs .grp,#tabs .sub-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
#tabs .sub-tabs{margin-top:0;padding-bottom:.25rem}
#tabs .grp button{font-weight:700}
#tabs .sub-tabs button{font-size:.9rem;padding:.35rem .75rem}
.who{display:flex;align-items:center;gap:.5rem;font-weight:700;color:var(--ink);font-size:.95rem;flex-basis:100%}
.who img{width:1.9rem;height:1.9rem;border-radius:50%;background:var(--line);object-fit:cover}
.cardhead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.4rem;font-weight:700;margin:.6rem 0 0}
.card-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.2rem;margin-top:.6rem;display:flex;flex-direction:column;gap:.8rem;align-items:flex-start}
.card-box button{max-width:100%}
.cardfront{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.5rem;font-weight:800;margin:0;line-height:1.3}
.cardback{font-size:1.2rem;margin:0;color:var(--teal);font-weight:700}
.rate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;width:100%}
.rate button{padding:.7rem .5rem;font-size:.95rem}
#gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:1.5rem;background:var(--bg);z-index:10}
body.locked #gate{display:flex}
body.locked .wrap{display:none}
#gate .card{max-width:24rem;width:100%;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2rem 1.5rem}
#gate h1{margin:0 0 .5rem;font-size:1.4rem}
#gate p{color:var(--muted);margin:0 0 1.5rem}
#gate #gateMsg{min-height:1.4em;font-size:.95rem;margin:1rem 0 0}
#gate .card{box-shadow:0 24px 60px -20px color-mix(in srgb,var(--teal) 40%,transparent)}
#gate .card .logo{width:4.5rem;margin:0 auto .8rem;display:block}
#gate .primary{width:100%;background:var(--teal);color:#fff;font-size:1.02rem;padding:.8rem 1rem}

/* Celular: layout em uma coluna, alvos de toque maiores, respeita área segura */
@media (max-width:640px){
  .wrap{padding:1rem .9rem calc(3rem + env(safe-area-inset-bottom,0px))}
  header{padding:1rem 0 .5rem}
  h1{font-size:clamp(1.9rem,9vw,2.4rem)}
  .brand{gap:.6rem}
  .sub{font-size:.95rem}
  .wave{height:64px;margin:1.1rem 0 .4rem}
  .stats{font-size:.9rem}
  nav{padding:.6rem 0;gap:.35rem}
  nav button{min-height:44px;padding:.5rem .9rem}
  #tabs .grp button{flex:1 1 auto;min-height:44px}
  #tabs .sub-tabs button{min-height:40px}
  .weekhead h2{font-size:1.35rem}
  .day{padding:.9rem .85rem;border-radius:16px}
  .dayhead{flex-direction:column;align-items:flex-start;gap:.3rem}
  .check{width:2.4rem;height:2.4rem}
  .task{gap:.6rem}
  .dzplay .primary{width:100%}
  .dzctl{flex-direction:column;align-items:stretch}
  .seg{width:100%}
  .seg button{flex:1;min-height:44px}
  .dlgact button{flex:1;min-height:44px}
  dialog{width:calc(100% - 1.5rem)}
}
@media (max-width:360px){
  .wave{height:52px}
  h1{font-size:1.75rem}
}
.rtext{white-space:pre-wrap;margin-top:1rem;line-height:1.65}
.rmeta{color:var(--muted);font-size:.85rem;margin-top:.6rem}
.err{color:var(--danger);font-size:.95rem;margin-top:.6rem}

dialog{border:0;border-radius:16px;padding:0;width:min(34rem,calc(100% - 2rem));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,35,.35)}
dialog::backdrop{background:rgba(12,20,32,.55)}
.dlg{padding:1.3rem 1.3rem 1.1rem}
.dlg h2{font-size:1.35rem;font-weight:700}
.dlg .ctx{color:var(--muted);font-size:.92rem;margin:.35rem 0 1rem}
label{display:block;font-weight:700;font-size:.95rem;margin:.8rem 0 .3rem}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem}
textarea{min-height:8rem;resize:vertical}
.dlgact{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.1rem;flex-wrap:wrap}
.dzctl{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.6rem}
.dzctl select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:.45rem .75rem;font-size:.92rem;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.dzmeta{color:var(--muted);font-size:.92rem;margin:.3rem 0}
.dzplay{display:flex;gap:.6rem;flex-wrap:wrap;margin:.6rem 0 .2rem}
.dzplay .primary{font-size:1.05rem;padding:.75rem 1.3rem}
.dzstatus{color:var(--muted);font-size:.9rem;min-height:1.2em;margin:.3rem 0}
.dzres{margin-top:1rem}
.dzscore{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.6rem;font-weight:800;margin:0 0 .4rem}
.dzscore.hi{color:var(--teal)} .dzscore.mid{color:var(--amber)} .dzscore.lo{color:var(--danger)}
.dzwords{font-size:1.15rem;line-height:1.9;margin:.2rem 0}
.w-ok{color:var(--teal);font-weight:700}
.w-miss{color:var(--danger);font-weight:700;text-decoration:underline wavy;text-underline-offset:4px}
.w-extra{color:var(--muted);text-decoration:line-through}
.dzlegend{color:var(--muted);font-size:.82rem;margin:.2rem 0 .8rem}
.dzorig{margin:.35rem 0}
.vids{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem}
.vid{display:inline-flex;align-items:center;gap:.3rem;font-size:.88rem;font-weight:700;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:.3rem .75rem;text-decoration:none}
.vid:hover{text-decoration:underline}
.task.done .vid{opacity:.7}
.readx{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;border-top:1px dashed var(--line);margin-top:.4rem;padding-top:.7rem;font-size:.9rem;color:var(--muted)}
.vid.read{color:var(--amber);background:var(--amber-soft)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* ===== Redesign v3: layout de app, identidade "estúdio noturno" ===== */
:root{
  --bg:#0A0D18; --surface:#131A2C; --surface-2:#1A2338; --ink:#F3F1FF; --muted:#9AA3C2; --line:#25304B;
  --teal:#FF6B4A; --teal-soft:rgba(255,107,74,.14); --amber:#8B7CFF; --amber-soft:rgba(139,124,255,.16);
  --lime:#C8F25A; --danger:#FF8A75; --bar-empty:#243050;
  --radius:22px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F2FB; --surface:#FFFFFF; --surface-2:#F0EDFA; --ink:#15172B; --muted:#5F6785; --line:#DCD8EE;
    --teal:#F0553A; --teal-soft:#FDE6DF; --amber:#6A56F5; --amber-soft:#E8E4FF; --lime:#7DB81E; --bar-empty:#DCD8EE;
  }
}
body{background:
  radial-gradient(900px 500px at 85% -10%,rgba(255,107,74,.16),transparent 60%),
  radial-gradient(700px 500px at -5% 105%,rgba(139,124,255,.14),transparent 60%),var(--bg);
  background-attachment:fixed; font-size:1.02rem}
h1,h2,h3{letter-spacing:-.01em}

/* Estrutura: barra lateral + conteúdo */
.app{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:32px 26px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(10px)}
.side header{padding:0}
.side .brand{margin-bottom:.4rem}
.side h1{font-size:1.45rem;font-weight:800}
.side .logo{width:2.9rem}
.side .kicker{font-size:1.02rem;margin-top:.8rem}
.side .sub{font-size:.88rem;line-height:1.5}
.side .wave{height:120px;margin:1.4rem 0 .6rem;gap:4px}
.side .wave button{flex:1 0 8px;min-width:8px}
.side .wave span{border-radius:6px 6px 3px 3px}
.side .stats{flex-direction:column;gap:.5rem;font-size:.9rem}
.side .stats strong{font-size:1.4rem;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.side #who{margin-top:1.2rem}
.side #who img{width:2.2rem;height:2.2rem;border:2px solid var(--line)}
.side #authBtn,.side .ghost{margin-top:.8rem;width:100%;border-radius:14px}
.side a.ghost{display:block;text-align:center;text-decoration:none;color:var(--ink)}

.content{padding:32px clamp(20px,4vw,48px) 96px;min-width:0;max-width:1120px}
#tabs{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border:0;padding:14px 0 10px;margin:0 0 10px}
#tabs .grp{margin:0 0 8px;gap:8px}
#tabs .grp button{border-radius:14px;padding:.6rem 1.05rem;border:1px solid var(--line);background:var(--surface);font-weight:700}
#tabs .grp button[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 8px 24px -10px var(--teal)}
#tabs .sub-tabs button{border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:700}
#tabs .sub-tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.weekhead{margin:1.2rem 0 1.2rem}
.weekhead h2{font-size:clamp(1.6rem,3vw,2.3rem);font-weight:800}
.weekhead p{font-size:1.02rem}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.3rem 1.4rem;margin-bottom:1.1rem;box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.day.isToday{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal),0 20px 50px -30px var(--teal)}
.dayhead h3{font-size:1.2rem;font-weight:800}
.tag{border-radius:999px;font-weight:700;padding:.2rem .7rem}
.task{padding:.8rem 0;gap:.9rem}
.check{width:2.2rem;height:2.2rem;border-radius:12px;border:2px solid var(--teal);background:transparent}
.task.done .check{background:var(--lime);border-color:var(--lime)}
.task.done .check svg{stroke:#0A0D18}
.task.done .ttext{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.note{background:var(--surface-2);border-left:3px solid var(--amber);border-radius:0 12px 12px 0}
.linkbtn{color:var(--amber)}
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.4rem 1.5rem;margin:1.6rem 0}
.primary{background:var(--teal);color:#fff;border-radius:14px;padding:.75rem 1.25rem;box-shadow:0 10px 30px -14px var(--teal)}
.primary:hover{filter:brightness(1.06)}
.ghost{border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.card-box{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:1.6rem;position:relative;overflow:hidden}
.card-box::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--teal),var(--amber))}
.cardhead span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.4rem .9rem;font-size:.95rem}
.cardfront{font-size:clamp(1.5rem,3.4vw,2.2rem);color:var(--ink)}
.cardback{font-size:clamp(1.15rem,2.4vw,1.5rem);color:var(--lime)}
.rate button{border-radius:16px}
.dzres .w-ok{color:var(--lime)}
.dzscore.hi{color:var(--lime)}
dialog{border-radius:24px;background:var(--surface)}

/* Celular: barra inferior fixa e layout de uma coluna */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:22px 18px 18px}
  .side .wave{height:70px}
  .side .stats{flex-direction:row;flex-wrap:wrap;gap:.3rem 1rem}
  .side .stats strong{font-size:1.1rem}
  .side #who,.side #authBtn,.side .ghost{display:inline-flex;width:auto;margin-top:.6rem}
  .content{padding:14px 14px 130px}
  #tabs{position:fixed;left:0;right:0;bottom:0;top:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);border-radius:0;margin:0;z-index:30}
  #tabs .grp{margin:0;justify-content:space-between;flex-wrap:nowrap}
  #tabs .grp button{flex:1;min-height:52px;padding:.4rem .3rem;font-size:.82rem;border-radius:16px;text-align:center;border:0;background:transparent}
  #tabs .grp button[aria-selected="true"]{background:var(--teal-soft);color:var(--teal);box-shadow:none}
  #tabs .sub-tabs{margin:.2rem 0 0;flex-wrap:nowrap;overflow-x:auto}
  .day{padding:1.1rem 1rem}
  .card-box{padding:1.2rem}
}
@media (max-width:900px) and (min-width:0px){
  #tabs .sub-tabs{position:static}
}

/* ===== Menu lateral ===== */
body.locked .app{display:none}
.side{display:flex;flex-direction:column;gap:20px}
.side header{padding:0}
#tabs{position:static;background:none;backdrop-filter:none;border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:16px;z-index:auto;overflow:visible}
.navtitle{margin:0 0 4px 6px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.navlist{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:.62rem .8rem;border-radius:12px;font-weight:700;font-size:.98rem;min-height:44px}
.nv:hover{background:var(--surface-2)}

    card.innerHTML=`<div class="dayhead"><h3>Dia ${d.n} · ${fmt(d.date)}</h3>${tag}</div>`;
    d.tasks.forEach((tk,i)=>{
      const k=key(d.n,i), done=!!state.done[k];
      const row=document.createElement("div"); row.className="task"+(done?" done":"");
      const btn=document.createElement("button"); btn.className="check"; btn.innerHTML=CHECK;
      btn.setAttribute("aria-label",(done?"Desmarcar: ":"Concluir: ")+tk.l); btn.setAttribute("aria-pressed",done);
      btn.onclick=(ev)=>{ev.stopPropagation();toggle(d,i);};
      row.onclick=()=>toggle(d,i);
      const body=document.createElement("div"); body.className="ttext";
      const b=document.createElement("b"); b.textContent=tk.l+": "; body.appendChild(b); body.appendChild(document.createTextNode(tk.x));
      const vs=VIDS[`${d.n}-${i}`]; if(vs){const vl=document.createElement("div"); vl.className="vids";
        vs.forEach(v=>{const l=document.createElement("a"); l.className="vid"; l.href=vurl(v); l.target="_blank"; l.rel="noopener noreferrer"; l.textContent="▶ "+v.t; l.onclick=e=>e.stopPropagation(); vl.appendChild(l);});
        body.appendChild(vl);}
      row.append(btn,body); card.appendChild(row);
    });
    const rd=READ[d.n]; if(rd){const r=document.createElement("div"); r.className="readx";
      const lb=document.createElement("span"); lb.textContent="📖 Leitura extra (opcional) · "+rd[0]+": ";
      const a=document.createElement("a"); a.className="vid read"; a.href=rd[2]; a.target="_blank"; a.rel="noopener noreferrer"; a.textContent=rd[1]+" ↗";
      r.append(lb,a); card.appendChild(r);}
    m.appendChild(card);
  });
}

function toggle(d,i){
  const k=key(d.n,i);
  if(state.done[k]) delete state.done[k]; else state.done[k]=true;
  persist(); render();
}

const RED={gonna:"going to",wanna:"want to",gotta:"got to",hafta:"have to",kinda:"kind of",sorta:"sort of",lemme:"let me",gimme:"give me",dunno:"do not know",shoulda:"should have",coulda:"could have",woulda:"would have",musta:"must have",outta:"out of",lotta:"lot of",cannot:"can not",ok:"okay"};
const PRON=["he","she","it","that","there","what","who","where","how","here","let"];
function norm(str){
  let s=" "+str.toLowerCase().replace(/[’‘`´]/g,"'").replace(/-/g," ")+" ";
  s=s.replace(/\bcan't\b/g,"can not").replace(/\bwon't\b/g,"will not").replace(/\bshan't\b/g,"shall not");
  s=s.replace(/n't\b/g," not").replace(/'re\b/g," are").replace(/'m\b/g," am").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'d\b/g," would");
  s=s.replace(/\b(\w+)'s\b/g,(m,w)=>PRON.includes(w)?(w==="let"?"let us":w+" is"):w+"s");
  s=s.replace(/[^a-z0-9' ]/g," ").replace(/'/g,"");
  return s.split(/\s+/).filter(Boolean).flatMap(w=>RED[w]?RED[w].split(" "):[w]);
}
function diff(a,b){ // a = alvo, b = resposta
  const n=a.length,m=b.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ops=[];let i=0,j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){ops.push({k:"ok",w:a[i]});i++;j++;} else if(L[i+1][j]>=L[i][j+1]){ops.push({k:"miss",w:a[i]});i++;} else {ops.push({k:"extra",w:b[j]});j++;} }
  while(i<n)ops.push({k:"miss",w:a[i++]}); while(j<m)ops.push({k:"extra",w:b[j++]});
  return {ops,score:n?Math.round(L[0][0]/n*100):0};
}

function allCards(){

  SETS.forEach((st,si)=>st.items.forEach((it,i)=>out.push({id:`c${si}i${i}`,front:it.s,back:it.t,set:st.name})));

function dueCards(limit){const today=DAY(); return allCards().filter(c=>(!cardFilter||c.set===cardFilter)&&cardState(c.id).due<=today).sort((a,b)=>cardState(a.id).due-cardState(b.id).due).slice(0,limit);}
function nextState(c,q){
  let {ease,ivl,reps}=c;
  if(q===0){ivl=1; ease=Math.max(1.3,ease-0.2); reps=0;}
  else{
    reps++;
    if(q===1){ease=Math.max(1.3,ease-0.15); ivl=Math.max(1,Math.round(ivl*1.2));}
    else if(q===2){ivl=ivl<=1?3:Math.round(ivl*ease);}
    else{ease+=0.15; ivl=ivl<=1?4:Math.round(ivl*ease*1.3);}
  }
  return {ease,ivl,reps,due:DAY()+ivl};
}
// Sequência de dias com "congelar": um dia perdido é perdoado se houver congelamento disponível.
// Você começa com 1 e ganha mais 1 a cada 7 dias seguidos (máximo 3).
function touchStreak(){
  const t=DAY(); const s=state.streak||{last:-1,count:0};
  if(s.last===t) return;
  const fz=state.freezes??1;
  if(s.last===t-1) s.count++;
  else if(s.last===t-2&&fz>0){state.freezes=fz-1; s.count++; s.saved=(s.saved||0)+1;}
  else s.count=1;
  s.last=t;
  if(s.count>0&&s.count%7===0) state.freezes=Math.min(3,(state.freezes??1)+1);
  state.streak=s;
}

}

let qz=null;
function buildQuiz(){
  const pool=shuffle(phrasePool()), types=["cloze","order","listen"], qs=[];
  const vocab=[...new Set(pool.join(" ").split(/\s+/).map(strip).filter(w=>w.length>3))];
  for(let i=0;i<9&&i<pool.length;i++){
    const t=pool[i], type=types[i%3], tokens=t.split(/\s+/);
    if(type==="cloze"){
      const idx=tokens.map((_,k)=>k).filter(k=>strip(tokens[k]).length>3);
      const k=idx.length?idx[Math.floor(Math.random()*idx.length)]:0, ans=strip(tokens[k]);
      const wrong=shuffle(vocab.filter(w=>w.toLowerCase()!==ans.toLowerCase())).slice(0,3);
      const shown=tokens.slice(); shown[k]="_____"+((tokens[k].match(/[.,!?;:]+$/)||[""])[0]);
      qs.push({type,t,shown:shown.join(" "),ans,opts:shuffle([ans,...wrong])});
    } else if(type==="order"){
      qs.push({type,t,target:tokens,bank:shuffle(tokens.map((w,k)=>({w,k})))});
    } else {
      const wrong=shuffle(pool.filter(x=>x!==t)).slice(0,3);
      qs.push({type,t,opts:shuffle([t,...wrong])});
    }
  }
  return {qs,i:0,score:0,built:[],checked:false,last:null,pick:null,done:false};
}

let au={running:false,cat:"Todas",slow:true,pause:3,token:0};
function speakAsync(text,rate){return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=rate; u.onend=()=>res(); u.onerror=()=>res(); speechSynthesis.speak(u);}catch(e){res();}});}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function stopAudio(){ if(!au.running) return; au.running=false; au.token++; try{speechSynthesis.cancel();}catch(e){} }
async function runAudio(list,status){
  au.running=true; au.token++; const tok=au.token, live=()=>au.running&&tok===au.token;
  for(let i=0;i<list.length&&live();i++){
    status.textContent=`Frase ${i+1} de ${list.length}: ${list[i].back}`;
    await speakAsync(list[i].back,1); if(!live()) break;
    await wait(au.pause*1000); if(!live()) break;
    if(au.slow){ await speakAsync(list[i].back,.7); if(!live()) break; await wait(1200); }
  }
  if(tok===au.token){ au.running=false; status.textContent="Sessão de áudio concluída. +20 XP"; addXp(20); stat("audio"); persist(); }
}
function renderAudio(m){
  pageTitle(m,"Modo áudio","Ouça sem olhar a tela. Depois de cada frase há uma pausa para você repetir em voz alta.");

  const cats=["Todas",...new Set(allCards().map(c=>c.set))];

  cats.forEach(c=>{const o=el("option",null,c); o.value=c; if(c===au.cat) o.selected=true; sel.appendChild(o);});
  sel.onchange=()=>{au.cat=sel.value;};

  ps.onchange=()=>{au.pause=Number(ps.value);};
  const lab=el("label","opt2"); const cb=el("input"); cb.type="checkbox"; cb.checked=au.slow; cb.onchange=()=>{au.slow=cb.checked;}; lab.append(cb,document.createTextNode(" Repetir mais devagar"));
  const status=el("p","dzstatus",au.running?"Tocando…":"");
  const play=btn("primary","▶ Iniciar",()=>{
    stopAudio();
    const pool=allCards().filter(c=>au.cat==="Todas"||c.set===au.cat);
    runAudio(shuffle(pool).slice(0,15),status);
  });
  const stop=btn("ghost","⏹ Parar",()=>{stopAudio(); status.textContent="Parado.";});
  const row=el("div","dzctl"); row.append(sel,ps); const act=el("div","dzplay"); act.append(play,stop);
  box.append(row,lab,act,status);
  m.appendChild(box);
}

function renderTrilha(m){
  const cur=currentDayIdx();
  WEEKS.forEach((W,wi)=>{

    const lab=el("div"); lab.append(el("div","unit-k",`SEÇÃO ${wi+1}`),el("div","unit-t",UNIT_TITLE(W)));
    top.append(lab,btn("guia","GUIA",()=>go(wi))); unit.append(top,el("div","unit-g",W.goal)); m.appendChild(unit);
    const path=el("div","path"), offs=[0,40,68,40,0,-40,-68,-40];
    W.days.forEach((d,k)=>{
      const idx=d.n-1, st=dayStatus(d), row=el("div","node-row");
      row.style.transform=`translateX(${offs[k%8]}px)`;
      if(idx===cur) row.appendChild(el("div","tip","COMEÇAR"));
      const b=el("button","node "+st+(idx===cur?" current":"")+((d.review||d.test)?" big":""));
      b.setAttribute("aria-label",`Dia ${d.n}, ${fmt(d.date)}: ${st==="done"?"concluído":st==="part"?"em andamento":"a fazer"}`);
      b.title=`Dia ${d.n} · ${fmt(d.date)}`;
      b.textContent=st==="done"?"✓":((d.review||d.test)?"★":String(d.n));
      b.onclick=()=>openDay(wi,d.n);
      row.appendChild(b); path.appendChild(row);
    });
    m.appendChild(path);
  });
}

async function attachRef(doc){
  ref=doc;
  const snap=await ref.get();
  if(snap.exists){
    const d=snap.data()||{};
    state=Object.assign({},d,{done:d.done||{}});
    try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
    render(); setSync("Salvo na sua conta");
  } else {
    persist(); // primeira vez nesta conta: envia o progresso deste aparelho
  }
}

async function startCloudSync(){
  try{
    if(window.claude&&window.claude.use){
      const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      const id=db&&user&&await user.id();
      if(id){ document.body.classList.remove("locked"); await attachRef(db.collection("data/users/"+id).doc("estado")); return; }
    }
  }catch(e){}
  if(!FIREBASE_CONFIG||!window.firebase){ document.body.classList.remove("locked"); setSync("Salvo neste navegador"); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth(), fdb=firebase.firestore();
    const provider=new firebase.auth.GoogleAuthProvider();
    const login=()=>auth.signInWithPopup(provider).catch(()=>{ $("gateMsg").textContent="Login não concluído. Tente de novo."; });
    $("gateBtn").onclick=login;
    const btn=$("authBtn"); btn.hidden=false;
    btn.onclick=()=>{ if(auth.currentUser) return auth.signOut(); return login(); };
    auth.onAuthStateChanged(async u=>{
      if(!u){
        ref=null; btn.textContent="Entrar com Google";
        document.body.classList.add("locked"); setSync("Entre para salvar seu progresso");
        return;
      }
      auth0=u; document.body.classList.remove("locked"); btn.textContent="Sair";
      const who=$("who"); if(who){ who.hidden=false; who.textContent=""; const img=document.createElement("img"); img.alt=""; if(u.photoURL) img.src=u.photoURL; const nm=document.createElement("span"); nm.textContent="Progresso de "+(u.displayName||u.email||"sua conta"); who.append(img,nm); }
      render();
      try{ await attachRef(fdb.collection("users").doc(u.uid).collection("app").doc("estado")); }
      catch(e){ setSync("Não foi possível carregar sua conta; salvo neste navegador"); }
    });
  }catch(e){ document.body.classList.remove("locked"); setSync("Salvo neste navegador"); }
}
startCloudSync();
